; Production PHP settings for the portfolio API image.
; Values here are non-secret runtime tuning; nothing environment-specific
; belongs in this file.

expose_php = Off

; Errors are written to the container log, never to the HTTP response, so a
; failure cannot leak a stack trace, internal path or credential to a visitor.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Filament uploads media; keep the body limits aligned with each other.
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The application tree is immutable inside the image, so revalidation is
; pure overhead; a new deployment means a new image.
opcache.validate_timestamps = 0
