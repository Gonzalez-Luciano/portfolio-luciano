<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Missing CV state — Phase 2 prototype</title>
    <script>
      (() => {
        const saved = localStorage.getItem('portfolio-prototype-theme');
        const savedTheme = saved === 'light' || saved === 'dark' ? saved : null;
        const dark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="../styles/tokens.css">
