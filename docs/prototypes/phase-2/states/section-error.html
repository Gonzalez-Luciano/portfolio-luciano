<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Section error state — Phase 2 prototype</title>
    <script>
      (() => {
        const saved = localStorage.getItem('portfolio-prototype-theme');
        const savedTheme = saved === 'light' || saved === 'dark' ? saved : null;
        const dark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/states.css">
  </head>
  <body class="state-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header data-site-header>
      <div class="site-header__inner container">
        <a class="site-header__identity" href="../index.html">LG / Backend</a>
        <div class="site-header__utilities"><a class="site-header__utility" href="../es/" lang="es">ES</a></div>
      </div>
    </header>
    <main id="main-content" class="container">
      <section aria-labelledby="work-heading">
        <h1 id="work-heading">Work</h1>
        <div class="error-panel" role="alert">
          <p class="error-panel__label">Error</p>
          <p>We couldn't load this portfolio section. Please try again.</p>
          <button class="retry-button" type="button">Try this section again</button>
        </div>
      </section>
    </main>
  </body>
</html>
