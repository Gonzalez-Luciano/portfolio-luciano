<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading state — Phase 2 prototype</title>
    <script>
      (() => {
        const saved = localStorage.getItem('portfolio-prototype-theme');
        const savedTheme = saved === 'light' || saved === 'dark' ? saved : null;
        const dark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/states.css">
  </head>
  <body class="state-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header data-site-header>
      <div class="site-header__inner container">
        <a class="site-header__identity" href="../index.html">LG / Backend</a>
        <div class="site-header__utilities"><a class="site-header__utility" href="../es/" lang="es">ES</a></div>
      </div>
    </header>
    <main id="main-content" class="container" aria-busy="true" aria-describedby="loading-status">
      <p id="loading-status" role="status" class="utility-label">Loading portfolio content… / Cargando contenido del portfolio…</p>
      <div class="state-stack" aria-hidden="true">
        <div class="skeleton skeleton--hero"></div>
        <div class="skeleton skeleton--section"></div>
        <div class="skeleton skeleton--section"></div>
        <div class="skeleton skeleton--contact"></div>
      </div>
    </main>
  </body>
</html>
