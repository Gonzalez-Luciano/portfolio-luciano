<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site error state — Phase 2 prototype</title>
    <script>
      (() => {
        const saved = localStorage.getItem('portfolio-prototype-theme');
        const savedTheme = saved === 'light' || saved === 'dark' ? saved : null;
        const dark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/states.css">
    <script type="module" src="../scripts/main.js"></script>
  </head>
  <body class="state-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header data-site-header>
      <div class="site-header__inner container">
        <a class="site-header__identity" href="../index.html">LG / Backend</a>
        <div class="site-header__utilities">
          <a class="site-header__utility site-header__language" href="../es/" lang="es">ES</a>
          <button class="theme-toggle site-header__utility" type="button" data-theme-toggle data-label-light="Switch to light theme" data-label-dark="Switch to dark theme">Theme</button>
        </div>
      </div>
    </header>
    <main id="main-content" class="container">
      <section aria-labelledby="site-error-heading">
        <div class="error-panel" role="alert">
          <p class="error-panel__label">Error</p>
          <h1 id="site-error-heading">We couldn't load the portfolio content</h1>
          <p>You can still use the contact links below or return to the prototype index.</p>
          <p><a href="../index.html">Back to the prototype index</a></p>
        </div>
        <nav class="state-contact" aria-label="Safe contact links">
          <a href="https://www.linkedin.com/in/luciano-gonz%C3%A1lez-590350294" rel="me noopener noreferrer">LinkedIn</a>
          <a href="https://github.com/Gonzalez-Luciano" rel="me noopener noreferrer">GitHub</a>
          <a href="mailto:lucianogonzalez12004@gmail.com">Email</a>
        </nav>
      </section>
    </main>
  </body>
</html>
