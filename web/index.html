<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Portfolio</title>
    <style>
      /* Styles the noscript fallback scene in <body>; harmless with scripting enabled since
         <noscript> content is never parsed into the DOM in that case. */
      .noscript-scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #f5efe6;
      }
      .noscript-scene img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <script>
      // Applies the saved or system theme before the first paint to avoid a flash.
      ;(function () {
        var prefersDark = false
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (error) {}
        var stored = null
        try {
          stored = window.localStorage.getItem('portfolio-theme')
        } catch (error) {}
        var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript-scene">
        <img src="/media/scroll/ink-tree-network-v3-poster.webp" alt="" />
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
